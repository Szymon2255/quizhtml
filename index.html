<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz HTML i CSS</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            padding: 2rem;
            border: 1px solid var(--border);
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        .question-counter {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .score-badge {
            background-color: var(--border);
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            line-height: 1.4;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .option-btn {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--border);
            border-color: var(--primary);
        }

        .option-btn.correct {
            background-color: rgba(16, 185, 129, 0.2);
            border-color: var(--accent);
            color: #d1fae5;
        }

        .option-btn.incorrect {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: #fee2e2;
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 0.85rem;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--primary-hover);
        }

        .results-screen {
            text-align: center;
        }

        .results-screen h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .results-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .results-grade {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            color: var(--text-muted);
        }

        .results-grade span {
            color: var(--text-color);
            font-weight: bold;
            font-size: 1.5rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
